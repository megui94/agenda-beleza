{% extends "base.html" %}
{% block title %}Criar Conta • {{ super() }}{% endblock %}

{% block content %}

<section class="page-hero soft-gradient" style="padding-bottom: 20px;">
  <div class="container text-center">
    <h1 class="hero-title">Criar Conta</h1>
    <p class="hero-subtitle">Junte-se a nós para cuidar de si.</p>
  </div>
</section>

<section class="container main-section">
  
  <div class="floating-card" style="max-width: 500px; margin: 0 auto;">
    
    <form method="POST" action="{{ url_for('registar') }}" class="form" onsubmit="return validarSenha(event)">
      
      <div class="form-row">
        <label for="nome">Nome completo</label>
        <input type="text" 
               id="nome" 
               name="nome" 
               class="modern-input" 
               placeholder="Ex: Ana Silva" 
               required
               value="{{ request.form.get('nome', '') }}"> 
      </div>

      <div class="form-row">
        <label for="email">E-mail</label>
        <input type="email" 
               id="email" 
               name="email" 
               class="modern-input" 
               placeholder="exemplo@gmail.com" 
               required
               value="{{ request.form.get('email', '') }}">
      </div>

      <div class="form-row">
        <label for="telefone">Telefone</label>
        <input type="tel" 
               id="telefone" 
               name="telefone" 
               class="modern-input" 
               placeholder="(xx) xxxxx-xxxx"
               value="{{ request.form.get('telefone', '') }}">
      </div>

      <div class="form-row password-field" style="position: relative;">
        <label for="password">Senha</label>
        <input type="password" 
               id="password" 
               name="password" 
               class="modern-input" 
               placeholder="••••••••" 
               required
               minlength="8">
        <button type="button" class="show-password" onclick="togglePass('password')">👁️</button>
      </div>
      
      <p class="form-note">
        A senha deve ter pelo menos 8 caracteres, incluindo 1 letra maiúscula, 1 minúscula e 1 número.
      </p>

      <div class="form-row" style="position: relative;">
        <label for="confirm_password">Confirmar Senha</label>
        <input type="password" 
               id="confirm_password" 
               name="confirm_password" 
               class="modern-input" 
               placeholder="••••••••" 
               required>
      </div>

      <div id="form-warning" class="alert alert-warning" style="display:none; margin-top:15px;"></div>

      <div class="form-actions" style="margin-top: 30px;">
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
          Criar Conta
        </button>
      </div>

      <div class="text-center" style="margin-top: 20px; font-size: 0.9rem;">
        Já tem conta? <a href="{{ url_for('login') }}" style="color: #d63384; font-weight: 600;">Entrar aqui</a>
      </div>

    </form>
  </div>
</section>

<script>
// Alternar visibilidade da senha
function togglePass(id) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
  } else {
    input.type = "password";
  }
}

// Mostrar aviso no JS
function mostrarAviso(msg){
  const alert = document.getElementById("form-warning");
  alert.style.display = "block";
  alert.textContent = msg;
}

// Validar antes de enviar
function validarSenha(e){
  const s = document.getElementById("password").value;
  const c = document.getElementById("confirm_password").value;
  const alert = document.getElementById("form-warning");
  
  alert.style.display = "none"; // Limpa avisos anteriores

  if(s !== c){ 
      e.preventDefault(); 
      mostrarAviso("⚠️ As senhas não coincidem!"); 
      return false; 
  }
  
  // Validação de segurança
  if(s.length < 8 || !/[A-Z]/.test(s) || !/[a-z]/.test(s) || !/[0-9]/.test(s)){
    e.preventDefault(); 
    mostrarAviso("❌ A senha deve ter 8 caracteres, maiúscula, minúscula e número."); 
    return false;
  }
  
  return true;
}
</script>

<style>
  /* Estilos Específicos para Formulários */
  .form-row { margin-bottom: 20px; }
  .form-row label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95rem; }
  
  .modern-input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.2s;
      background-color: #f9fafb;
  }
  .modern-input:focus {
      border-color: #fce4ec;
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(214, 51, 132, 0.1);
      outline: none;
  }

  .form-note { font-size: 0.8rem; color: #666; margin-top: -10px; margin-bottom: 20px; line-height: 1.4; }
  
  .show-password {
      position: absolute;
      right: 15px;
      top: 38px;
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      font-size: 1.1rem;
  }
  .show-password:hover { color: #d63384; }
</style>

{% endblock %}
