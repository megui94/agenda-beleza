{% extends "base.html" %}
{% block title %}Feedback • {{ super() }}{% endblock %}
{% block content %}

<section class="page-hero">
  <div class="container">
    <h1>Deixe o seu feedback</h1>
    <p>A sua opinião é muito importante para nós!</p>
  </div>
</section>

<section class="section container">
  <form method="POST" class="form form-book">
    <div class="form-row">
      <label for="nome">Nome</label>
      <input type="text" name="nome" id="nome" value="{{ session.nome or '' }}" placeholder="O seu nome" required />
    </div>

    <div class="form-row">
      <label for="classificacao">Classificação</label>
      <select name="classificacao" id="classificacao" required>
        <option value="">Selecione uma opção</option>
        <option value="5">⭐⭐⭐⭐⭐ - Excelente</option>
        <option value="4">⭐⭐⭐⭐ - Muito Bom</option>
        <option value="3">⭐⭐⭐ - Satisfatório</option>
        <option value="2">⭐⭐ - Regular</option>
        <option value="1">⭐ - Insuficiente</option>
      </select>
    </div>

    <div class="form-row">
      <label for="comentario">Comentário</label>
      <textarea name="comentario" id="comentario" rows="4" placeholder="Deixe aqui o seu comentário (opcional)..."></textarea>
    </div>

    <div class="form-row" style="text-align:center;">
      <button type="submit" class="btn btn-primary">Enviar Feedback</button>
    </div>
  </form>
</section>

{% endblock %}
