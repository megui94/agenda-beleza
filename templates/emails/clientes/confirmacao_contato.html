<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmação de Contacto</title>
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      background-color: #fff5f8;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #ffd7e6;
    }

    .header {
      background: linear-gradient(135deg, #f472b6, #ec4899);
      color: #fff;
      text-align: center;
      padding: 24px 16px;
    }

    .header h1 {
      font-size: 1.6rem;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .content {
      padding: 30px 40px;
      text-align: center;
    }

    .content h2 {
      color: #a81e5d;
      font-size: 1.3rem;
      margin-bottom: 16px;
    }

    .content p {
      font-size: 15px;
      line-height: 1.6;
      color: #555;
      margin-bottom: 16px;
    }

    .cta-button {
      display: inline-block;
      background: linear-gradient(90deg, #ec4899, #f472b6);
      color: white;
      padding: 12px 30px;
      text-decoration: none;
      border-radius: 25px;
      font-weight: 600;
      margin-top: 10px;
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .footer {
      background-color: #fff0f6;
      text-align: center;
      font-size: 13px;
      color: #777;
      padding: 18px 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>💖 Agenda de Beleza</h1>
    </div>

    <div class="content">
      <h2>Olá {{ nome }}!</h2>
      <p>
        Recebemos a sua mensagem sobre <b>{{ assunto }}</b> e a nossa equipa já está a analisá-la.
      </p>
      <p>
        Em breve entraremos em contacto para responder às suas dúvidas ou pedidos.
      </p>

      <a href="https://agenda-beleza.onrender.com" class="cta-button">🌸 Visitar o site</a>
    </div>

    <div class="footer">
      © {{ now().year }} Agenda de Beleza — Cuidar de si é essencial 💅
    </div>
  </div>
</body>
</html>
