<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Beleza - Notificação</title>
    <style>
        /* Estilos globais para compatibilidade */
        body { margin: 0; padding: 0; min-width: 100%; background-color: #f4f7f6; font-family: sans-serif; }
        table { border-collapse: collapse; border-spacing: 0; }
        td { padding: 0; }
        img { border: 0; line-height: 100%; outline: none; text-decoration: none; }
        
        /* Estilos específicos */
        .container { background-color: #ffffff; border-radius: 12px; margin: 30px auto; max-width: 600px; width: 90%; border: 1px solid #fce4ec; }
        .header { background-color: #d63384; padding: 20px 30px; border-top-left-radius: 12px; border-top-right-radius: 12px; text-align: center; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; color: #ffffff; font-weight: 700; text-decoration: none; }
        .content { padding: 30px; color: #333333; font-size: 15px; line-height: 1.6; }
        .cta { display: inline-block; padding: 10px 20px; background-color: #d63384; color: #ffffff !important; border-radius: 25px; text-decoration: none; font-weight: bold; margin: 15px 0; }
        .footer { padding: 20px 30px; font-size: 12px; color: #999999; text-align: center; border-top: 1px solid #f0f0f0; }
        .box { background: #fff0f5; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #fce4ec; }

        @media screen and (max-width: 600px) {
            .container { margin: 10px auto; }
            .content { padding: 20px; }
            .header { padding: 15px 20px; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f7f6;">
    <center style="width: 100%; background-color: #f4f7f6;">
        <div class="container">
            <!-- Header -->
            <div class="header">
                <a href="{{ url_for('index', _external=True) }}" class="logo" style="color: #ffffff; text-decoration: none;">Agenda Beleza</a>
            </div>
            
            <!-- Conteúdo (Substituído pelo bloco) -->
            <div class="content">
                {% block conteudo %}{% endblock %}
            </div>
            
            <!-- Footer -->
            <div class="footer">
                &copy; {{ current_year if current_year is defined else 2025 }} Agenda Beleza. Todos os direitos reservados.<br>
                <a href="{{ url_for('politica_privacidade', _external=True) }}" style="color: #999999;">Política de Privacidade</a>
            </div>
        </div>
    </center>
</body>
</html>
